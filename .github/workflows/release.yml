# Runs when you push a version tag:  npm version patch && git push --follow-tags
#   1. a GitHub Release with a ready-to-run zip (start.command / start.bat)
#   2. a Docker image on ghcr.io/lulu38m/spider-crawler (amd64 + arm64)
#   3. the npm package, if an NPM_TOKEN secret is set (Settings → Secrets → Actions)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        run: |
          name="spider-crawler-${GITHUB_REF_NAME}"
          mkdir -p "release/out/$name/server"
          cp -r dist bin package.json LICENSE "release/out/$name/"
          cp server/api.mjs "release/out/$name/server/"
          cp release/start.command release/start.bat release/README.txt "release/out/$name/"
          find "release/out/$name/dist" -name '*.map' -delete
          chmod +x "release/out/$name/start.command" "release/out/$name/bin/spider-crawler.mjs"
          cd release/out && zip -qr -X "$name.zip" "$name"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/out/*.zip
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
